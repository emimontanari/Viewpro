name: DB Backup (prod → R2)

# Logical nightly backups of both production Neon databases, uploaded to
# Cloudflare R2 (bucket: inmoview-backups). Independent of Neon PITR — these
# dumps survive even if a Neon project is deleted.
#
# Restore: gunzip < dump.sql.gz | psql "<target DIRECT_URL>"
#
# Required repo secrets:
#   NEON_PROD_DIRECT_URL      - inmoview-prod DIRECT (unpooled) connection string
#   NEON_PLATFORM_DIRECT_URL  - viewpro-platform-prod DIRECT connection string
#   R2_S3_ENDPOINT            - https://<account>.r2.cloudflarestorage.com
#   R2_ACCESS_KEY_ID          - R2 S3 access key
#   R2_SECRET_ACCESS_KEY      - R2 S3 secret key
#   BACKUP_HEARTBEAT_URL      - ping URL of an external dead-man's switch
#                               (healthchecks.io or equivalent), no trailing slash
#
# Why the heartbeat lives outside this repo: a run that is never started -
# because Actions minutes ran out, because the schedule silently stopped
# firing, or because the workflow was removed - executes zero steps and
# allocates no runner. Nothing inside this file can report that, not even a
# separate job with `if: failure()`, since that job would need a runner too.
# On 2026-07-27..31 exactly this happened and five nightly backups were lost
# without a single alert. The external monitor therefore alerts on the ABSENCE
# of the ping below, which is the only signal that survives the workflow not
# running at all. Configure its period at 24h with a grace window of ~2h.

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily (~03:00 ART)
  workflow_dispatch: {} # allow manual runs

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
      BUCKET: inmoview-backups
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Ubuntu ships pg_dump 16 by default; force the 17 binaries onto PATH.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump and upload both databases
        run: |
          # Deliberately NOT `set -e`: with it, a failure on the first database
          # aborted the step and the second was never attempted, so one broken
          # database silently cost the backup of both. Each dump now runs
          # independently and the step fails at the end if any of them did.
          # `pipefail` still matters — without it a failing pg_dump feeding a
          # succeeding gzip would look like success and upload a truncated file.
          set -uo pipefail
          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          # Without `set -e` this line no longer aborts the step on its own, and
          # an empty stamp would collapse every object key to a fixed
          # "<name>-.sql.gz" — so each nightly run would overwrite the previous
          # archive instead of adding one. Cheap to check, silent to lose.
          if [ -z "$STAMP" ]; then
            echo "::error::empty timestamp; refusing to build backup filenames"
            exit 1
          fi
          FAILED=""
          dump_one() {
            local name="$1" url="$2"
            local file="${name}-${STAMP}.sql.gz"
            echo "Dumping ${name}..."
            if ! pg_dump --no-owner --no-privileges "$url" | gzip -9 > "$file"; then
              echo "::error::pg_dump failed for ${name}"
              # Never leave a truncated dump behind for the upload to pick up.
              rm -f "$file"
              return 1
            fi
            local size; size=$(du -h "$file" | cut -f1)
            echo "  ${file} (${size})"
            if ! aws s3 cp "$file" "s3://${BUCKET}/${name}/${file}" --endpoint-url "$R2_ENDPOINT" --only-show-errors; then
              echo "::error::upload failed for ${name}"
              return 1
            fi
            echo "  uploaded → s3://${BUCKET}/${name}/${file}"
          }
          dump_one "inmoview-prod" "${{ secrets.NEON_PROD_DIRECT_URL }}" || FAILED="${FAILED} inmoview-prod"
          dump_one "viewpro-platform-prod" "${{ secrets.NEON_PLATFORM_DIRECT_URL }}" || FAILED="${FAILED} viewpro-platform-prod"
          if [ -n "$FAILED" ]; then
            echo "::error::backup failed for:${FAILED}"
            exit 1
          fi

      - name: Prune backups older than 30 days
        run: |
          set -euo pipefail
          # Widened from 30 days: the cutover contract retains an old generation for one
          # calendar month, and 30 days is a day short of that on every 31-day month.
          # This only ever keeps MORE than before. It does not make the job
          # lineage-aware — the prune is still per-object age, so it cannot yet honour a
          # retention window that opens at the cutover rather than at each upload.
          CUTOFF=$(date -u -d '45 days ago' +%s)
          for prefix in inmoview-prod viewpro-platform-prod; do
            aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "${prefix}/" \
              --endpoint-url "$R2_ENDPOINT" --query 'Contents[].{Key:Key,LastModified:LastModified}' --output json 2>/dev/null \
              | jq -c '.[]?' | while read -r obj; do
                  key=$(echo "$obj" | jq -r '.Key')
                  lm=$(date -u -d "$(echo "$obj" | jq -r '.LastModified')" +%s)
                  if [ "$lm" -lt "$CUTOFF" ]; then
                    echo "pruning $key"
                    aws s3 rm "s3://${BUCKET}/${key}" --endpoint-url "$R2_ENDPOINT" --only-show-errors
                  fi
                done
          done

      # Both heartbeat steps are continue-on-error: a monitoring ping must never
      # turn a good backup into a failed run. A ping that fails to leave the
      # runner degrades into silence, which the monitor reads as absence and
      # alerts on anyway - the safe direction to fail in.
      - name: Report success to dead-man's switch
        if: success()
        continue-on-error: true
        run: curl -fsS -m 10 --retry 3 "${{ secrets.BACKUP_HEARTBEAT_URL }}"

      # Covers the other half: the run DID start but a dump or upload broke.
      # Absence detection would eventually catch it, but only after the grace
      # window; this reports it immediately.
      - name: Report failure to dead-man's switch
        if: failure()
        continue-on-error: true
        run: curl -fsS -m 10 --retry 3 "${{ secrets.BACKUP_HEARTBEAT_URL }}/fail"
