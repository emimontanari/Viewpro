name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Cancel superseded runs on the same ref so a fresh push doesn't queue behind stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # The pnpm workspace lives one level below the repo root.
    working-directory: viewpro-app

jobs:
  quality:
    name: Build · Typecheck · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: viewpro-app/pnpm-lock.yaml

      - name: Validate Vercel ignored-build policy
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { spawnSync } = require('node:child_process');
          const { existsSync, mkdtempSync, rmSync, writeFileSync } = require('node:fs');
          const { tmpdir } = require('node:os');
          const { join } = require('node:path');

          const config = require('./apps/app-new/vercel.json');
          const command = config.ignoreCommand;
          assert.equal(typeof command, 'string', 'vercel.json must define ignoreCommand');
          assert.match(command, /VERCEL_ENV/);
          assert.match(command, /production/);
          assert.match(command, /exit 1/);
          assert.match(command, /npx turbo-ignore/);

          const directory = mkdtempSync(join(tmpdir(), 'vercel-ignore-'));
          const probe = join(directory, 'turbo-ignore-called');
          const fakeNpx = join(directory, 'npx');
          writeFileSync(
            fakeNpx,
            '#!/bin/sh\n[ "$1" = turbo-ignore ] || exit 64\n: > "$VERCEL_IGNORE_PROBE"\nexit 73\n',
            { mode: 0o755 }
          );

          try {
            const environment = { ...process.env, PATH: `${directory}:${process.env.PATH}`, VERCEL_IGNORE_PROBE: probe };
            const production = spawnSync('/bin/sh', ['-c', command], { env: { ...environment, VERCEL_ENV: 'production' } });
            assert.equal(production.status, 1, 'production must continue the build');
            assert.equal(existsSync(probe), false, 'production must not invoke turbo-ignore');

            const preview = spawnSync('/bin/sh', ['-c', command], { env: { ...environment, VERCEL_ENV: 'preview' } });
            assert.equal(preview.status, 73, 'preview must preserve turbo-ignore exit status');
            assert.equal(existsSync(probe), true, 'preview must delegate to turbo-ignore');
            console.log('Vercel ignored-build policy validated');
          } finally {
            rmSync(directory, { recursive: true, force: true });
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  test:
    name: Test
    needs: quality
    runs-on: ubuntu-latest

    services:
      # Product database (InmoView) — mirrors apps/api/test/setup-env.ts defaults.
      postgres-product:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: viewpro
          POSTGRES_PASSWORD: viewpro
          POSTGRES_DB: viewpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viewpro -d viewpro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Platform database (ViewPro control-plane) — isolated instance on 5434.
      postgres-platform:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: viewpro_platform
          POSTGRES_PASSWORD: viewpro_platform
          POSTGRES_DB: viewpro_platform_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U viewpro_platform -d viewpro_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: viewpro-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply product migrations
        env:
          DATABASE_URL: postgresql://viewpro:viewpro@localhost:5432/viewpro_test?schema=public
          # schema.prisma now declares directUrl = env("DIRECT_URL"); no pooler in CI, so mirror DATABASE_URL.
          DIRECT_URL: postgresql://viewpro:viewpro@localhost:5432/viewpro_test?schema=public
        run: pnpm --filter @viewpro/api exec prisma migrate deploy

      - name: Apply platform migrations
        env:
          DATABASE_URL: postgresql://viewpro_platform:viewpro_platform@localhost:5434/viewpro_platform_test
          # schema.prisma now declares directUrl = env("DIRECT_URL"); no pooler in CI, so mirror DATABASE_URL.
          DIRECT_URL: postgresql://viewpro_platform:viewpro_platform@localhost:5434/viewpro_platform_test
        run: pnpm --filter @viewpro/platform-api exec prisma migrate deploy

      # Run test workspaces serially. Each vitest project is already file-serial;
      # forcing turbo concurrency to 1 stops the backends from contending over the
      # runner and reproducing the aggregate beforeAll timeout seen locally.
      - name: Test
        run: pnpm exec turbo run test --concurrency=1

  production-cutover:
    name: Production cutover contracts
    runs-on: ubuntu-latest
    # Qualification bounds its own subprocesses and reports residue rather than stalling,
    # so this is a backstop against an unforeseen hang, not the intended failure signal.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Qualification builds throwaway worktrees from the checkout, and this job runs
      # candidate code, so no credentials are persisted into the workspace.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # node --test does not discover *.spec.mjs by directory, so each file is listed.
      # Qualification spawns Git and makes timing assertions, so it runs unparallelised.
      - name: Contracts
        run: |
          node --test --test-concurrency=1 \
            scripts/production-cutover/lineage-contract.spec.mjs \
            scripts/production-cutover/tree-byte-contract.spec.mjs \
            scripts/production-cutover/release-contract.spec.mjs \
            scripts/production-cutover/receipt.spec.mjs \
            scripts/production-cutover/checkpoint.spec.mjs \
            scripts/production-cutover/roles.spec.mjs \
            scripts/production-cutover/bootstrap.spec.mjs \
            scripts/production-cutover/backup-lineage.spec.mjs \
            scripts/production-cutover/rollback.spec.mjs \
            scripts/production-cutover/candidate.spec.mjs

      # Retention arithmetic is UTC-anchored, and a local-time implementation is
      # indistinguishable from a UTC one on a UTC runner. Running this one suite off UTC
      # is what makes the anchoring observable where CI actually runs.
      - name: Retention arithmetic off UTC
        env:
          TZ: Pacific/Kiritimati
        run: node --test scripts/production-cutover/backup-lineage.spec.mjs

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: viewpro-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking gate on PRODUCTION dependencies only — dev/build tooling
      # advisories (e.g. @nestjs/cli chain) do not ship to users and must not
      # red-gate merges. Runtime highs were remediated via pnpm.overrides +
      # removing the dead sort-by dep.
      - name: Audit production dependencies (high and above)
        run: pnpm audit --prod --audit-level high
